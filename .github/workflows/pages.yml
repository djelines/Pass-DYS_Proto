name: Publier la maquette

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tant que GitHub Pages est aussi réglé sur « Deploy from a branch », sa propre publication
      # tourne en parallèle et écrase la nôtre : on attend qu'elle soit finie pour publier en dernier.
      - name: Attendre la publication automatique de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            r=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest")
            echo "$r" | grep -q '"${{ github.sha }}"' && echo "$r" | grep -Eq '"status": *"(built|errored)"' && exit 0
            sleep 5
          done
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Maquette
      - id: deployment
        uses: actions/deploy-pages@v4
